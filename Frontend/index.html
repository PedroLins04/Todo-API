<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Registrar | KeepTheFlow</title>
    <link rel="icon" type="image/svg+xml" href="FavIcon.svg" />

    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="loginStyle.css" />
  </head>

  <body class="login-page">
    <main class="login-container">
      <section class="login-card">
        <a href="index.html" class="login-brand">
          <i class="bi bi-clipboard-data-fill fs-2" style="color: #8ed5ff"></i>
          <span class="logo text-white fw-bold fs-4"
            >KeepThe<span style="color: #8ed5ff; font-size: larger"
              >Flow</span
            ></span
          >
        </a>

        <div class="login-heading">
          <h1>Bem-vindo</h1>
          <p style="font-weight: 600">crie sua conta e keep the flow</p>
          <a href="/login" style="text-decoration: none"
            >Já possui conta? clique para fazer login</a
          >
        </div>

        <div class="login-field">
          <label for="name">Nome</label>

          <div class="login-input-wrapper">
            <i class="bi bi-person"></i>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              autocomplete="name"
              maxlength="100"
              required
            />
          </div>
        </div>

        <form id="formRegister">
          <div class="login-field">
            <label for="email">E-mail</label>

            <div class="login-input-wrapper">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="login-field">
            <label for="password">Senha</label>

            <div class="login-input-wrapper">
              <i class="bi bi-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="login-toggle-password"
                id="togglePassword"
                aria-label="Mostrar senha"
              >
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
          </div>

          <p
            id="registerMensagem"
            class="login-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button type="submit" id="btnRegister" class="login-submit">
            <span>Criar conta</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <div class="login-footer">
          <span>Organize suas tarefas.</span>
          <span>Concentre-se no que importa.</span>
        </div>
      </section>

      <p class="login-copyright">© 2026 KeepTheFlow</p>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="register.js"></script>
  </body>
</html>
